name: Mise à jour des enseignes
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  brands:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run brands
      - name: Commit (le fichier de contrôle garde le dépôt actif, donc les workflows planifiés)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u +"%Y-%m-%dT%H:%MZ" > data/brands.checked
          git add data
          git commit -m "Enseignes : mise à jour hebdomadaire" || exit 0
          git push
